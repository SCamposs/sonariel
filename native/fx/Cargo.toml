[package]
name = "sonariel-fx"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["dsp-core", "transform"]
resolver = "3"

[dependencies]
sonariel-transform = { path = "transform" }
sonariel-dsp-core = { path = "dsp-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
