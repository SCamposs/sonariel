[package]
name = "sonariel"
version = "0.4.0-rc.1"
description = "Sonariel local audio workstation"
license-file = "../LICENSE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"], default-features = false }
tauri-plugin-updater = "=2.14.0"
tauri-plugin-dialog = "=2.8.3"
