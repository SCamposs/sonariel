[build-system]
requires = ["setuptools==71.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonariel-core"
version = "0.3.0-beta.1"
description = "Local audio orchestration for the Sonariel desktop and MCP"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
dependencies = ["psutil==7.2.2", "requests==2.34.2", "soundfile==0.14.0", "jsonschema==4.25.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pyinstaller==6.16.0"]

[project.scripts]
sonariel-core = "sonariel.__main__:main"

[tool.setuptools]
package-dir = {"" = "core"}

[tool.setuptools.package-data]
sonariel = ["recipes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
